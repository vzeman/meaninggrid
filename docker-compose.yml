name: meaninggrid

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: meaninggrid
      POSTGRES_USER: meaninggrid
      POSTGRES_PASSWORD: meaninggrid
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - meaninggrid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meaninggrid -d meaninggrid"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - meaninggrid_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: meaninggrid
      MINIO_ROOT_PASSWORD: meaninggrid-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - meaninggrid_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 meaninggrid meaninggrid-local
        mc mb -p local/meaninggrid-raw || true
        mc mb -p local/meaninggrid-artifacts || true
        mc mb -p local/meaninggrid-exports || true

  qdrant:
    image: qdrant/qdrant:v1.12.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - meaninggrid_qdrant_data:/qdrant/storage

  migrate:
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.backend
    command: >
      sh -c "alembic -c migrations/alembic.ini upgrade head &&
      python -m meaninggrid_db.seed"
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.backend
    command: uvicorn meaninggrid_api.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.backend
    command: celery -A meaninggrid_worker.main.celery_app worker --loglevel=info
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.backend
    command: python -m meaninggrid_scheduler.main
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.backend
    command: pytest
    env_file:
      - .env.example
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  mcp-server:
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.backend
    command: uvicorn meaninggrid_mcp.main:app --host 0.0.0.0 --port 8010 --reload
    env_file:
      - .env.example
    ports:
      - "8010:8010"
    volumes:
      - .:/app
    depends_on:
      api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: deployments/docker-compose/Dockerfile.web
    command: pnpm --filter @meaninggrid/web dev --hostname 0.0.0.0 --port 3000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MCP_URL: http://localhost:8010
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  meaninggrid_postgres_data:
  meaninggrid_redis_data:
  meaninggrid_minio_data:
  meaninggrid_qdrant_data:
