[project]
name = "meaninggrid"
version = "0.1.0"
description = "Open-source semantic intelligence and context management for AI agents."
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/core",
  "packages/db",
  "apps/api",
  "apps/worker",
  "apps/scheduler",
  "apps/mcp-server",
  "apps/cli"
]
